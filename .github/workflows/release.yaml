name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-15,         target: aarch64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: "5.40"
          distribution: 'strawberry'

      - name: Build standalone executable
        run: bash build-standalone.sh

      - name: Package
        id: package
        run: |
          NAME="latexdiff-${{ github.ref_name }}-${{ matrix.target }}"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/latexdiff.exe latexdiff.exe
            7z a "$NAME.zip" latexdiff.exe
            echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            cp build/latexdiff latexdiff
            tar czf "$NAME.tar.gz" latexdiff
            echo "asset=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.package.outputs.asset }}

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
